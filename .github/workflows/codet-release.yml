name: Codet - Release (Linux deb + apt repo)

on:
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        description: Build even if this VS Code version was already released
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

env:
  APP_NAME: Codet
  BINARY_NAME: codet
  ORG_NAME: ${{ github.repository_owner }}
  GH_REPO_PATH: ${{ github.repository }}
  ASSETS_REPOSITORY: ${{ github.repository }}
  VSCODE_QUALITY: stable
  OS_NAME: linux
  DISABLE_UPDATE: yes
  VSCODE_ARCH: x64

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      SHOULD_BUILD: ${{ steps.c.outputs.SHOULD_BUILD }}
      RELEASE_VERSION: ${{ steps.c.outputs.RELEASE_VERSION }}
      MS_TAG: ${{ steps.c.outputs.MS_TAG }}
      MS_COMMIT: ${{ steps.c.outputs.MS_COMMIT }}
      UPSTREAM_SHA: ${{ steps.c.outputs.UPSTREAM_SHA }}
    steps:
      - name: Decide whether a new build is needed
        id: c
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          UPSTREAM_SHA="$(git ls-remote https://github.com/VSCodium/vscodium.git refs/heads/master | cut -f1)"
          STABLE="$(curl -fsSL "https://raw.githubusercontent.com/VSCodium/vscodium/${UPSTREAM_SHA}/upstream/stable.json")"
          MS_TAG="$(jq -r .tag <<<"${STABLE}")"
          MS_COMMIT="$(jq -r .commit <<<"${STABLE}")"

          LATEST="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 30 --json tagName --jq '.[].tagName' | { grep -v '^apt-repo$' || true; } | head -n1)"
          SHOULD_BUILD=yes
          RELEASE_VERSION=""
          RE="^${MS_TAG//./\\.}[0-9]+\$"
          if [[ -n "${LATEST}" && "${LATEST}" =~ ${RE} ]]; then
            if gh release view "${LATEST}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -q '_amd64\.deb$'; then
              [[ "${FORCE}" == "true" ]] || SHOULD_BUILD=no
            fi
            RELEASE_VERSION="${LATEST}"   # same VS Code version: reuse the tag
          fi
          if [[ -z "${RELEASE_VERSION}" ]]; then
            RELEASE_VERSION="${MS_TAG}$(printf '%04d' $(( $(date -u +%-j) * 24 + $(date -u +%-H) )))"
          fi
          {
            echo "SHOULD_BUILD=${SHOULD_BUILD}"
            echo "RELEASE_VERSION=${RELEASE_VERSION}"
            echo "MS_TAG=${MS_TAG}"
            echo "MS_COMMIT=${MS_COMMIT}"
            echo "UPSTREAM_SHA=${UPSTREAM_SHA}"
          } | tee -a "${GITHUB_OUTPUT}"

  compile:
    needs: check
    if: needs.check.outputs.SHOULD_BUILD == 'yes'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: "yes"
      SHOULD_BUILD_REH: "no"
      SHOULD_BUILD_REH_WEB: "no"
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream VSCodium (pinned) and apply Codet overlay
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.UPSTREAM_SHA }}
        run: |
          ./codet/merge_upstream.sh "${UPSTREAM_SHA}"
          ./codet/apply_overlay.sh

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 10
          platform: x64

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev

      - name: Clone VSCode repo
        run: ./get_repo.sh

      - name: Build
        run: ./build.sh

      - name: Compress vscode artifact
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - name: Compress merged repo scripts
        run: tar -czf codet-repo.tar.gz --exclude=./vscode --exclude=./.git --exclude=./vscode.tar.gz --exclude=./vscode.txt --exclude=./codet-repo.tar.gz .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode
          path: ./vscode.tar.gz
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codet-repo
          path: ./codet-repo.tar.gz
          retention-days: 1

  package:
    needs: [check, compile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: vscodium/vscodium-linux-build-agent:focal-x64
    env:
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      SHOULD_BUILD: "yes"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codet-repo

      - name: Unpack merged repo scripts
        run: tar -xzf codet-repo.tar.gz && rm codet-repo.tar.gz

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode

      - name: Install dependencies
        run: ./build/linux/deps.sh

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Build binary
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_arch: x64
        run: ./build/linux/package_bin.sh

      - name: Build deb
        env:
          SHOULD_BUILD_RPM: "no"
          SHOULD_BUILD_TAR: "no"
          SHOULD_BUILD_REH: "no"
          SHOULD_BUILD_REH_WEB: "no"
          SHOULD_BUILD_CLI: "no"
          VSCODE_SYSROOT_REPOSITORY: ${{ steps.build.outputs.VSCODE_SYSROOT_REPOSITORY }}
          VSCODE_SYSROOT_VERSION: ${{ steps.build.outputs.VSCODE_SYSROOT_VERSION }}
          VSCODE_SYSROOT_PREFIX: ${{ steps.build.outputs.VSCODE_SYSROOT_PREFIX }}
        run: ./prepare_assets.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: assets/*.deb
          retention-days: 1

  publish:
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deb
          path: debs

      - name: Install repo tooling
        run: sudo apt-get update -y && sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: printf '%s' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Create / update GitHub release
        run: |
          set -euo pipefail
          NOTES="Codet ${RELEASE_VERSION}: VSCodium build of VS Code ${MS_TAG} (https://github.com/microsoft/vscode/tree/${MS_COMMIT}) with XDG base directory support."
          if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --clobber debs/*.deb
          else
            gh release create "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --title "${RELEASE_VERSION}" --notes "${NOTES}" debs/*.deb
          fi

      - name: Update APT repository
        run: ./codet/update_apt_repo.sh debs
